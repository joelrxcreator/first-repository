<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Pendelpilot</title>
  <meta name="description" content="Dein persönlicher Pendel- und Tagesplaner.">
  <meta name="apple-mobile-web-app-title" content="Pendelpilot">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F5F7">
  <script>
    // Hell/Dunkel vor dem ersten Zeichnen setzen (kein Aufblitzen). Ohne Wahl folgt die App dem Handy.
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="offline" role="status" hidden></div>
  <div id="app" aria-live="polite"></div>
  <div id="dock" class="dock" hidden></div>
  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation" hidden></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
